name: prueba-fcbq
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          for u in https://www.basquetcatala.cat/ https://www.basquetcatala.cat/jwt.php https://www.basquetcatala.cat/partits/calendari_club_global/2024/437; do
            echo "== $u"; curl -s -A "$UA" -o /tmp/b -w "%{http_code} %{url_effective} %{redirect_url}\n" "$u"; head -c 300 /tmp/b | tr '\n' ' '; echo; done
          echo "== msstats sin token"; curl -s -o /tmp/m -w "%{http_code}\n" "https://msstats.optimalwayconsulting.com/v1/fcbq/matches/1/stats?currentSeason=true" -H "federation: fcbq"; head -c 200 /tmp/m; echo
          T=$(curl -s -A "$UA" https://www.basquetcatala.cat/jwt.php | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | head -1)
          echo "token: ${#T} chars"
