name: Detector de tiros (Windows)

on:
  push:
    branches: [main]
    paths: ["herramientas/detector-tiros/**", ".github/workflows/detector.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: herramientas/detector-tiros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" opencv-python==4.10.0.84 pyinstaller==6.11.1
      - name: Pruebas
        run: python -m unittest discover -s pruebas -v
      - name: Compilar
        run: pyinstaller --noconfirm --onedir --name detector --console --hidden-import numpy --collect-submodules numpy --collect-submodules cv2 detector.py
      - name: Prueba del ejecutable
        shell: bash
        run: |
          set +e
          python pruebas/video_sintetico.py prueba_exe.mp4 > sintetico.txt 2>&1 || echo "::warning::video sintetico: $(tr '\n' ' ' < sintetico.txt | tail -c 600)"
          ./dist/detector/detector.exe --help > salida.txt 2>&1; r=$?
          if [ $r -ne 0 ]; then echo "::error::--help ($r): $(tr '\n' ' ' < salida.txt | tail -c 1500)"; exit 1; fi
          if [ -f prueba_exe.mp4 ]; then
            ./dist/detector/detector.exe calibrar prueba_exe.mp4 --segundo 1 --sin-balon --aro "derecha=$(cd pruebas && python -c "import video_sintetico as v; print(*v.ARO, sep=chr(44))")" > salida.txt 2>&1; r=$?
            if [ $r -ne 0 ]; then echo "::error::calibrar ($r): $(tr '\n' ' ' < salida.txt | tail -c 1500)"; exit 1; fi
            ./dist/detector/detector.exe analizar prueba_exe.mp4 > salida.txt 2>&1; r=$?
            if [ $r -ne 0 ]; then echo "::error::analizar ($r): $(tr '\n' ' ' < salida.txt | tail -c 1500)"; exit 1; fi
            echo "::notice::ejecutable OK: $(tail -c 300 salida.txt | tr '\n' ' ')"
          fi
      - name: Empaquetar
        shell: pwsh
        run: |
          $d = "DetectorTiros"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item -Recurse dist\detector "$d\programa"
          Copy-Item distribucion\* $d
          Copy-Item LICENCIAS.md $d
          Compress-Archive -Path $d -DestinationPath DetectorTiros-Windows.zip
      - name: Publicar en la release "detector"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view detector >/dev/null 2>&1 || gh release create detector --title "Detector de tiros (Windows)" --notes "Descarga DetectorTiros-Windows.zip, descomprímelo y sigue LEEME.txt. Se actualiza solo con cada cambio del detector."
          gh release upload detector DetectorTiros-Windows.zip --clobber
